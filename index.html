
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}
video {
    position: fixed;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
</style>
</head>
<body>

<video id="video" autoplay loop playsinline>
    <source src="1029.webm" type="video/webm">
</video>

<script>
const video = document.getElementById("video");

video.play().catch(() => {
    video.muted = true;
    video.play().catch(console.error);
});

document.addEventListener("click", () => {
    video.muted = false;
    video.play().catch(console.error);
});
</script>

</body>
</html>
