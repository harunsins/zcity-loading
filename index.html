
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-City</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <video id="intro" autoplay loop playsinline>
        <source src="giris.webm" type="video/webm">
    </video>

    <script>
        const video = document.getElementById("intro");
        video.volume = 1;

        video.play().catch(() => {
            // Tarayıcı sesli otomatik oynatmayı engelleyebilir.
        });
    </script>

</body>
</html>
